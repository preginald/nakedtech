name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main  # Or 'master', depending on your default branch name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        key: ${{ secrets.DO_SSH_KEY }}
        port: 22
        script: |
          # Stop script if any command fails
          set -e
          
          # Navigate to the folder
          cd /var/www/nakedtech.au
          
          # Pull the latest code
          git pull origin main
          
          # Install dependencies (in case you added new plugins)
          npm install
          
          # Build the site
          npm run build

          # Permit the versioned document-root redirect rules and reload only
          # after Apache accepts the updated configuration.
          APACHE_CONF_NAME=nakedtech-au-directory
          sudo a2enmod rewrite
          sudo install -m 0644 \
            deploy/apache/nakedtech-au-directory.conf \
            "/etc/apache2/conf-available/${APACHE_CONF_NAME}.conf"
          sudo a2enconf "${APACHE_CONF_NAME}"
          if ! sudo apache2ctl configtest; then
            sudo a2disconf "${APACHE_CONF_NAME}"
            exit 1
          fi
          sudo systemctl reload apache2
