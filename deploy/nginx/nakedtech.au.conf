server {
    listen 80;
    server_name nakedtech.au;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nakedtech.au;

    ssl_certificate /etc/letsencrypt/live/nakedtech.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nakedtech.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nakedtech.au/_site;
    index index.html;

    location = /booking {
        return 301 https://nakedtech.au/contact/$is_args$args;
    }

    location = /booking/ {
        return 301 https://nakedtech.au/contact/$is_args$args;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    include /etc/nginx/snippets/static-cache.conf;
}
