server {
    listen 80;
    server_name nakedtech.au;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nakedtech.au;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/nakedtech.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nakedtech.au/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nakedtech.au/_site;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://forms.digitalsanctum.com.au; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src https://forms.digitalsanctum.com.au; worker-src 'self' blob:; upgrade-insecure-requests" always;

    location = /booking {
        return 301 https://nakedtech.au/contact/$is_args$args;
    }

    location = /booking/ {
        return 301 https://nakedtech.au/contact/$is_args$args;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # This duplicates the shared cache snippet because defining Cache-Control
    # in a location prevents inheritance of server-level security headers.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|ico|webp|avif|png|jpe?g|gif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://forms.digitalsanctum.com.au; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.facebook.com https://connect.facebook.net; frame-src https://forms.digitalsanctum.com.au; worker-src 'self' blob:; upgrade-insecure-requests" always;
        access_log off;
    }
}
